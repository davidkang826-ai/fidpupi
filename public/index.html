<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FidPuPi</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#e6f0fb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FidPuPi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #5577b3; --blue-dark: #2f4a7d; --blue-soft: #eef3fa; --blue-line: #cfdef2;
    --muted: #8a9bb8; --line: #edf2f9; --yellow: #ecc562; --card: #ffffff;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: linear-gradient(180deg, #e9f2fc 0%, #d9e7f7 100%) fixed;
    color: var(--blue-dark); overflow: hidden;
    -webkit-user-select: none; user-select: none; touch-action: manipulation;
  }
  button, input { font-family: inherit; }
  button { touch-action: manipulation; cursor: pointer; border: 0; }
  [hidden] { display: none !important; }
  body:not(.ready) .card { visibility: hidden; }

  .app {
    height: 100dvh; max-width: 460px; margin: 0 auto;
    padding: max(8px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column;
  }
  .bear-row {
    position: relative; z-index: 2; display: flex; justify-content: center; align-items: flex-end; gap: 6px;
    height: clamp(78px, 12dvh, 104px); margin-bottom: -14px; flex: none;
  }
  .bear-row svg.bear { height: 100%; width: auto; }
  .heart { width: 30px; height: 30px; margin-bottom: 34px; flex: none; opacity: .9; }

  .card {
    position: relative; flex: 1; min-height: 0; background: var(--card);
    border: 3px solid var(--blue-line); border-radius: 38px;
    box-shadow: 0 14px 36px rgba(85,119,179,.14);
    padding: 30px 26px 0; display: flex; flex-direction: column;
  }
  .card::before { content: ''; position: absolute; inset: 7px; border: 1.5px dashed #dbe7f5; border-radius: 30px; pointer-events: none; }
  .view { display: flex; flex-direction: column; flex: 1; min-height: 0; }

  .title { text-align: center; font-weight: 800; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; color: var(--blue); }
  .for { display: none !important; }
  .logout { position: absolute; top: 24px; left: 28px; background: none; color: #a9b7cf; font-weight: 700; font-size: 12px; padding: 6px; z-index: 2; }

  .clock { text-align: center; color: var(--blue-dark); font-weight: 700; font-size: 58px; line-height: 1; letter-spacing: -1.5px; margin: 20px 0 0; font-variant-numeric: tabular-nums; }
  .clock small { font-size: 18px; letter-spacing: 0; color: var(--muted); margin-left: 6px; font-weight: 700; }
  .clock .tz { display: block; font-size: 13px; font-weight: 600; letter-spacing: .4px; color: var(--muted); margin: 8px 0 0; }

  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--blue-soft); border-radius: 999px; padding: 4px; flex: none; margin-top: 22px; }
  .tab { background: transparent; color: var(--muted); font-weight: 700; font-size: 13px; height: 70px; border-radius: 999px; transition: background .15s, color .15s; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 0; }
  .tab .ic { width: 34px; height: 34px; opacity: .7; filter: saturate(.55); transition: opacity .15s, filter .15s, transform .15s; }
  .tab.active .ic { opacity: 1; filter: none; transform: scale(1.06); }
  .tab.active { background: #fff; color: var(--blue-dark); box-shadow: 0 1px 5px rgba(60,90,150,.16); }

  .stamp {
    flex: none; margin-top: 16px; width: 100%; height: 60px; border-radius: 999px; background: var(--blue); color: #fff;
    font-weight: 800; font-size: 18px; letter-spacing: .4px; box-shadow: 0 8px 18px rgba(85,119,179,.32);
    transition: transform .08s, box-shadow .08s;
  }
  .stamp:active { transform: translateY(2px) scale(.99); box-shadow: 0 3px 8px rgba(85,119,179,.3); }

  .list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 14px -8px 0; padding: 0 8px 8px; overscroll-behavior: contain; }
  .row { display: grid; grid-template-columns: auto 1fr auto 26px; align-items: center; gap: 10px; padding: 16px 0; border-bottom: 1px solid var(--line); position: relative; }
  .row.pop { animation: pop .28s ease-out; }
  @keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
  .steps { display: flex; gap: 6px; }
  .adj { width: 38px; height: 38px; border-radius: 50%; border: 0; font-weight: 700; font-size: 21px; line-height: 1; display: flex; align-items: center; justify-content: center; padding: 0; transition: transform .08s, background .12s; }
  .adj:active { transform: scale(.92); }
  .minus { background: #fdecee; color: #d9535f; }
  .minus:active { background: #f9d5d9; }
  .plus { background: #e6f4ec; color: #3f9a66; }
  .plus:active { background: #cfeadb; }
  .when { min-width: 0; padding-left: 4px; }
  .when .t { font-weight: 800; font-size: 22px; color: var(--blue-dark); line-height: 1.1; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.3px; }
  .when .t small { font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 3px; letter-spacing: 0; }
  .when .d { font-size: 12px; color: var(--muted); font-weight: 600; margin-top: 3px; }
  .since { text-align: right; }
  .since b { display: block; font-weight: 700; font-size: 17px; color: var(--blue); line-height: 1.1; font-variant-numeric: tabular-nums; }
  .since span { display: block; font-size: 10px; color: var(--muted); font-weight: 600; margin-top: 3px; }
  .since.none b { color: #c9d4e6; }
  .delwrap { position: relative; height: 26px; }
  .del { position: absolute; right: 0; top: 50%; transform: translateY(-50%); min-width: 26px; height: 26px; padding: 0 6px; border-radius: 13px; background: none; color: #c3cee0; font-size: 18px; font-weight: 600; line-height: 1; z-index: 1; white-space: nowrap; }
  .del.armed { background: #e5707a; color: #fff; font-size: 11px; font-weight: 700; padding: 0 10px; }
  .empty .eic { display: block; width: 64px; height: 64px; margin: 0 auto 12px; }
  .empty { text-align: center; color: var(--muted); font-weight: 600; padding: 34px 10px; font-size: 14px; line-height: 1.6; }

  .decor { flex: none; height: 44px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 8px 14px; position: relative; z-index: 1; }
  .decor svg { display: block; }

  /* auth */
  .auth { justify-content: center; gap: 12px; overflow-y: auto; padding: 6px 2px 10px; }
  .auth .sub { text-align: center; font-weight: 800; font-size: 22px; color: var(--blue-dark); margin: 0 0 6px; }
  .field { display: block; }
  .field span { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 5px 4px; }
  .field input { width: 100%; height: 48px; border-radius: 14px; border: 1.5px solid var(--blue-line); background: #fff; padding: 0 16px; font-weight: 600; font-size: 16px; color: var(--blue-dark); outline: none; -webkit-user-select: text; user-select: text; }
  .field input:focus { border-color: var(--blue); }
  .field input::placeholder { color: #b5c2d8; font-weight: 500; }
  .err { min-height: 18px; text-align: center; color: #d0505c; font-weight: 700; font-size: 13px; }
  .auth .stamp { margin-top: 0; }
  .auth .stamp:disabled { opacity: .7; }
  .link { background: none; color: var(--blue); font-weight: 700; font-size: 14px; padding: 8px; }
  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none; background: var(--blue-dark); color: #fff; font-weight: 700; font-size: 14px; padding: 10px 18px; border-radius: 999px; transition: .25s; z-index: 10; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-height: 660px) {
    .clock { font-size: 44px; margin-top: 12px; }
    .tabs { margin-top: 14px; } .tab { height: 54px; } .tab .ic { width: 24px; height: 24px; } .stamp { height: 54px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="bear-row">
    <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="#8aa9dc" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z"/></svg>

<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  const TZ = 'America/New_York';
  const TABS = ['feed', 'pee', 'poop'];
  const ICON = { feed: 'icFeed', pee: 'icPee', poop: 'icPoop' };
  const EMPTY = {
    feed: 'No feedings yet.<br>Tap Stamp when baby eats.',
    pee: 'No pees yet.<br>Tap Stamp to record one.',
    poop: 'No poops yet.<br>Tap Stamp to record one.',
  };
  const $ = id => document.getElementById(id);

  // ---------- state ----------
  let tab = 'feed';
  try { const t = localStorage.getItem('fidpupi.tab'); if (TABS.includes(t)) tab = t; } catch (e) {}
  let data = { feed: [], pee: [], poop: [] };
  let loggedIn = false, childName = '';

  async function api(method, url, body) {
    const r = await fetch(url, {
      method, credentials: 'same-origin',
      headers: body ? { 'Content-Type': 'application/json' } : {},
      body: body ? JSON.stringify(body) : undefined,
    });
    let j = {}; try { j = await r.json(); } catch (e) {}
    if (!r.ok) {
      if (r.status === 401 && loggedIn && !url.includes('/login')) showAuth();
      const err = new Error(j.error || 'Something went wrong. Please try again.'); err.status = r.status; throw err;
    }
    return j;
  }

  let toastT;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 3000);
  }
  async function reload() {
    try { data = await api('GET', '/api/records'); render(); } catch (e) {}
  }
  function saveFailed() { toast('Couldn’t save — check your connection.'); reload(); }

  // ---------- time helpers (all Eastern) ----------
  const timeFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', hour12: true });
  const dayFmt = new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' });
  const labelFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  const tzFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, timeZoneName: 'short' });

  function parts(ts) {
    const p = timeFmt.formatToParts(ts);
    const g = t => (p.find(x => x.type === t) || {}).value || '';
    return { hm: g('hour') + ':' + g('minute'), ap: g('dayPeriod') };
  }
  const mdyFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: '2-digit', day: '2-digit', year: 'numeric' });
  function dayLabel(ts) { return mdyFmt.format(ts).replace(/\//g, '-'); } // MM-DD-YYYY
  function span(ms) {
    const m = Math.max(0, Math.round(ms / 60000));
    return Math.floor(m / 60) + ':' + String(m % 60).padStart(2, '0');
  }

  // ---------- clock ----------
  const clockEl = $('clock'), ampmEl = $('ampm');
  let lastMinute = -1;
  function tick() {
    const m = Math.floor(Date.now() / 60000);
    if (m === lastMinute) return;
    lastMinute = m;
    const p = parts(Date.now());
    clockEl.firstChild.nodeValue = p.hm;
    ampmEl.textContent = p.ap;
    const z = (tzFmt.formatToParts(Date.now()).find(x => x.type === 'timeZoneName') || {}).value;
    $('tz').textContent = (childName ? childName + ' · ' : '') + dayLabel(Date.now()) + ' · ' + (z === 'EDT' ? 'EDT' : 'EST');
  }
  setInterval(tick, 1000); tick();

  // ---------- render ----------
  const listEl = $('list');
  const sortTab = t => data[t].sort((a, b) => b.ts - a.ts); // stable

  function rowHTML(rec, older) {
    const p = parts(rec.ts);
    const since = older ? span(rec.ts - older.ts) : '–';
    return `
      <div class="steps">
        <button class="adj minus" data-act="-1" data-id="${rec.id}" aria-label="1 minute earlier">−</button>
        <button class="adj plus" data-act="1" data-id="${rec.id}" aria-label="1 minute later">+</button>
      </div>
      <div class="when"><div class="t">${p.hm}<small>${p.ap}</small></div><div class="d">${dayLabel(rec.ts)}</div></div>
      <div class="since${older ? '' : ' none'}"><b>${since}</b><span>since last</span></div>
      <div class="delwrap"><button class="del" data-id="${rec.id}" aria-label="Delete this record">×</button></div>`;
  }

  function render(popId) {
    const items = data[tab];
    document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    if (!items.length) { listEl.innerHTML = `<div class="empty"><svg class="eic" aria-hidden="true"><use href="#${ICON[tab]}"/></svg>${EMPTY[tab]}</div>`; return; }
    listEl.innerHTML = '';
    items.forEach((rec, i) => {
      const row = document.createElement('div');
      row.className = 'row' + (rec.id === popId ? ' pop' : '');
      row.dataset.id = rec.id;
      row.innerHTML = rowHTML(rec, items[i + 1]);
      listEl.appendChild(row);
    });
  }

  // update text without replacing nodes (so press-and-hold keeps working)
  function refreshInPlace() {
    const items = data[tab];
    items.forEach((rec, i) => {
      const row = listEl.querySelector(`.row[data-id="${rec.id}"]`);
      if (!row) return;
      const p = parts(rec.ts), older = items[i + 1];
      row.querySelector('.t').innerHTML = `${p.hm}<small>${p.ap}</small>`;
      row.querySelector('.d').textContent = dayLabel(rec.ts);
      const s = row.querySelector('.since');
      s.classList.toggle('none', !older);
      s.querySelector('b').textContent = older ? span(rec.ts - older.ts) : '–';
    });
  }

  // ---------- tracker actions ----------
  document.querySelector('.tabs').addEventListener('click', e => {
    const b = e.target.closest('.tab'); if (!b) return;
    tab = b.dataset.tab; try { localStorage.setItem('fidpupi.tab', tab); } catch (e) {}
    render(); listEl.scrollTop = 0;
  });

  $('stamp').addEventListener('click', () => {
    const rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ts: Math.floor(Date.now() / 60000) * 60000 };
    data[tab].unshift(rec); sortTab(tab); render(rec.id); listEl.scrollTop = 0;
    if (navigator.vibrate) navigator.vibrate(15);
    api('POST', '/api/records', { id: rec.id, tab, ts: rec.ts }).catch(saveFailed);
  });

  // +/- with press-and-hold repeat (delegated so re-renders don't break it)
  let holdT = null, holdI = null; const moved = new Set();
  function nudge(id, dir) {
    const rec = data[tab].find(r => r.id === id); if (!rec) return;
    rec.ts += dir * 60000; moved.add(id);
    refreshInPlace();
  }
  function stopHold() {
    clearTimeout(holdT); clearInterval(holdI); holdT = holdI = null;
    if (moved.size) {
      const ids = [...moved]; moved.clear();
      sortTab(tab); render();
      ids.forEach(id => {
        const rec = data[tab].find(r => r.id === id);
        if (rec) api('PATCH', '/api/records/' + id, { ts: rec.ts }).catch(saveFailed);
      });
    }
  }
  listEl.addEventListener('pointerdown', e => {
    const b = e.target.closest('.adj'); if (!b) return;
    e.preventDefault();
    const id = b.dataset.id, dir = +b.dataset.act;
    nudge(id, dir);
    holdT = setTimeout(() => { holdI = setInterval(() => nudge(id, dir), 90); }, 450);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => window.addEventListener(ev, () => { if (holdT || holdI || moved.size) stopHold(); }));
  listEl.addEventListener('contextmenu', e => e.preventDefault());

  // delete: first tap arms ("Delete?"), second tap within 3s removes
  let armedBtn = null, armedT = null;
  function disarm() { clearTimeout(armedT); if (armedBtn) { armedBtn.classList.remove('armed'); armedBtn.textContent = '×'; } armedBtn = null; }
  listEl.addEventListener('click', e => {
    const b = e.target.closest('.del'); if (!b) return;
    if (armedBtn === b) {
      const id = b.dataset.id;
      data[tab] = data[tab].filter(r => r.id !== id);
      disarm(); render();
      api('DELETE', '/api/records/' + id).catch(saveFailed);
      return;
    }
    disarm(); armedBtn = b; b.classList.add('armed'); b.textContent = 'Delete?';
    armedT = setTimeout(disarm, 3000);
  });

  // ---------- auth ----------
  let mode = 'signup';
  function setMode(m) {
    mode = m;
    const signup = m === 'signup';
    $('childField').hidden = !signup;
    $('authSub').textContent = signup ? 'Create your account' : 'Welcome back';
    $('authBtn').textContent = signup ? 'Create account' : 'Log in';
    $('switch').textContent = signup ? 'Already have an account? Log in' : 'New here? Create an account';
    $('pw').autocomplete = signup ? 'new-password' : 'current-password';
    $('err').textContent = '';
  }
  $('switch').addEventListener('click', () => setMode(mode === 'signup' ? 'login' : 'signup'));

  $('auth').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $('authBtn'); if (btn.disabled) return;
    $('err').textContent = '';
    const body = { email: $('email').value, password: $('pw').value };
    if (mode === 'signup') body.child = $('child').value;
    btn.disabled = true; const label = btn.textContent; btn.textContent = '…';
    try {
      const me = await api('POST', mode === 'signup' ? '/api/signup' : '/api/login', body);
      $('pw').value = '';
      await enter(me);
    } catch (err) {
      $('err').textContent = err.message;
    } finally { btn.disabled = false; btn.textContent = label; }
  });

  $('logout').addEventListener('click', async () => {
    try { await api('POST', '/api/logout'); } catch (e) {}
    data = { feed: [], pee: [], poop: [] };
    showAuth();
  });

  function showAuth() {
    loggedIn = false;
    $('appview').hidden = true; $('auth').hidden = false; $('forName').hidden = true;
    setMode(mode);
  }
  async function enter(me) {
    data = await api('GET', '/api/records');
    loggedIn = true;
    childName = me.child;
    $('auth').hidden = true; $('appview').hidden = false;
    lastMinute = -1; tick(); render();
  }

  // pick up changes made on another phone when returning to the app
  document.addEventListener('visibilitychange', () => { if (!document.hidden && loggedIn) { lastMinute = -1; tick(); reload(); } });

  // ---------- boot ----------
  (async () => {
    try { await enter(await api('GET', '/api/me')); }
    catch (e) { showAuth(); }
    document.body.classList.add('ready');
  })();
})();
</script>
</body>
</html>
